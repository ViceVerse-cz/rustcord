[workspace]
members = ["apps/desktop", "crates/*", "tools/*"]
default-members = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
discord-voice = { path = "crates/discord-voice" }
model = { path = "crates/model" }
client-core = { path = "crates/client-core" }
discord-protocol = { path = "crates/discord-protocol" }
discord-api = { path = "crates/discord-api" }
discord-gateway = { path = "crates/discord-gateway" }
session-cache = { path = "crates/session-cache" }
ui = { path = "crates/ui" }
test-support = { path = "crates/test-support" }
eframe = { version = "=0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "wayland", "x11"] }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
tokio = { version = "1.50", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
zeroize = "1.8"
thiserror = "2"
url = "2"
platform = { path = "crates/platform" }
local-store = { path = "crates/local-store" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
dirs = "=7.0.0"
getrandom = "0.4"
time = { version = "0.3", features = ["parsing"] }
wry = "=0.57.0"
keyring = "=4.2.0"
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
debug = "line-tables-only"

[patch.crates-io]
# Replace an affected SHAKE dependency while retaining the compatible HPKE API.
hpke-rs = { path = "vendor/hpke-rs" }
