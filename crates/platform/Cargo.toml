[package]
name = "platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
client-core.workspace = true
notify-rust = { version = "=4.18.0", features = ["preview-macos-un"] }
winit.workspace = true
keyring.workspace = true
url.workspace = true
zeroize.workspace = true
getrandom.workspace = true
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk4 = { version = "=0.11.4", features = ["v4_10"] }
webkit6 = "=0.6.1"

[lints.rust]
# Native process enumeration permits unsafe only inside its audited Windows function.
unsafe_code = "deny"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = ["UI_Notifications", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "macos")'.dependencies]
futures-lite = "=2.6.1"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
wry.workspace = true
