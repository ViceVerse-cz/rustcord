name: native-client
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libxrandr-dev libxcursor-dev libvulkan-dev libasound2-dev cmake python3 dpkg-dev desktop-file-utils
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/login-handoff.cjs
      - run: cargo replay
      - name: Linux package regression
        if: runner.os == 'Linux'
        run: PYTHONDONTWRITEBYTECODE=1 python3 packaging/linux/test_package.py
      - run: cargo xtask package
      - run: cargo xtask package-voice
      - uses: actions/upload-artifact@v4
        with:
          name: serein-${{ runner.os }}-unsigned
          path: dist/
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - run: cargo install cargo-audit --version 0.22.2 --locked --no-default-features
      - run: cargo audit --deny warnings
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo xtask licenses
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/license-policy.cjs
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - run: rustup toolchain install nightly-2026-09-09 --profile minimal
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fetch --locked --manifest-path fuzz/Cargo.toml
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check
      - run: cargo xtask fuzz
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-fuzz-failures
          path: target/fuzz-smoke/*.crash
          if-no-files-found: ignore
          retention-days: 7
